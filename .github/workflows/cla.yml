name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAAssistant:
    # the reusable workflow can't exceed the caller's permissions, so grant what it needs explicitly
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    uses: restatedev/restate/.github/workflows/cla.yml@main
    secrets: inherit
