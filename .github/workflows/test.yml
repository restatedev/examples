name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.7.0
      - run: echo '{"ignorePatterns":[{"pattern":"https://docs.restate.dev/_mintlify/feedback/restate-6d46e1dc/agent-feedback"},{"pattern":"https://slack.restate.dev"},{"pattern":"^https://www.npmjs.com"}]}' > mlc_config.json
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-verbose-mode: 'yes'
          config-file: 'mlc_config.json'
  build-rust:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"

    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          rustflags: ""
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run tests
        run: ./.tools/run_rust_tests.sh

  build-jvm:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"
    strategy:
      matrix:
        jvm-version: [ 25 ]

    steps:
      - uses: actions/checkout@v3.7.0

      - name: Use JVM ${{ matrix.jvm-version }}
        uses: actions/setup-java@v4.9.1
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jvm-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.5.0

      - name: Run tests
        run: ./.tools/run_jvm_tests.sh

  build-node:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"
    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v3.7.0

      - name: Pull restate-server docker image
        run: docker pull docker.io/restatedev/restate:latest
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3.9.1
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: typescript/templates/node-gen/package.json

      - name: Run tests
        run: ./.tools/run_node_tests.sh

  build-altjs:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"

    steps:
      - uses: actions/checkout@v3.7.0

      # We just need npm from Node
      - name: Setup Node
        uses: actions/setup-node@v3.9.1
        with:
          node-version: 22.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1.2.2
        with:
          bun-version: latest

      - name: Run tests
        run: ./.tools/run_altjs_tests.sh

  build-go:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"
    strategy:
      matrix:
        go-version: [1.22]

    steps:
      - uses: actions/checkout@v3.7.0

      - name: Use Go ${{ matrix.go-version }}
        uses: actions/setup-go@v3.6.1
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: ./.tools/run_go_tests.sh

  build-py:
    # prevent from running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: ubuntu-latest
    env:
      RESTATE_DISABLE_TELEMETRY: "true"
    strategy:
      matrix:
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v3.7.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4.2.0
      - name: Run tests
        run: ./.tools/run_python_tests.sh
